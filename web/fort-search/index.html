<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fort Search</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="panel">
  <header>
    <h1>Fort Search</h1>
    <p class="sub"><span id="count">Loading…</span></p>
  </header>
  <div class="box">
    <input id="q" type="search" placeholder="Search castles, forts, ruins…" autocomplete="off" spellcheck="false" aria-label="Search">
    <div class="chips" id="chips" role="group" aria-label="Filters">
      <button data-k="1" class="on" aria-pressed="true"><i class="dot k1"></i>Castle</button>
      <button data-k="2" class="on" aria-pressed="true"><i class="dot k2"></i>Fort</button>
      <button data-k="3" class="on" aria-pressed="true"><i class="dot k3"></i>Ruin</button>
      <button data-k="4" class="on" aria-pressed="true"><i class="dot k4"></i>Other</button>
      <button data-f="prog" aria-pressed="false">In programme</button>
      <button data-f="osm" aria-pressed="false">Search map-only</button>
    </div>
  </div>
  <ol id="results" aria-live="polite"></ol>
  <footer>Wikidata (CC0) and © OpenStreetMap contributors (ODbL). “Notable” = a Wikipedia article, a heritage designation or World Heritage listing; “map-only” = mapped in OSM as a castle, fort or ruin.</footer>
</aside>
<main id="map" aria-label="Map"></main>
<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
