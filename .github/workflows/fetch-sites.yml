name: fetch-sites
# Phase 0 site universe. Push-triggered like fetch-geometry: put "sources" on line 1 of data/sites-raw/REQUEST.txt
# (all | wikidata,osm,unesco,asi) and optional ISO2 countries on line 2 (IN,PK,...), then push to dev.
on:
  push:
    branches: [dev]
    paths: ['data/sites-raw/REQUEST.txt']
  workflow_dispatch:
    inputs:
      sources: {description: "all or comma list of wikidata,osm,unesco,asi", default: "all"}
      countries: {description: "all or comma list of IN,PK,BD,NP,LK,AF,BT", default: "all"}
permissions: {contents: write}
concurrency: {group: fetch-sites, cancel-in-progress: false}
jobs:
  fetch:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Resolve request
        env:
          IN_SOURCES: ${{ inputs.sources }}
          IN_COUNTRIES: ${{ inputs.countries }}
        run: |
          S="$IN_SOURCES"; C="$IN_COUNTRIES"
          [ -z "$S" ] && S="$(sed -n 1p data/sites-raw/REQUEST.txt | tr -d ' \r')"
          [ -z "$C" ] && C="$(sed -n 2p data/sites-raw/REQUEST.txt | tr -d ' \r')"
          echo "SOURCES=${S:-all}" >> "$GITHUB_ENV"; echo "COUNTRIES=${C:-all}" >> "$GITHUB_ENV"
      - name: Fetch
        continue-on-error: true
        run: node tools/fetch-sites.mjs "$SOURCES" "$COUNTRIES"
      - name: Commit and push raw extracts first (never conflicts; protects a long fetch)
        run: |
          git config user.name "fetch-sites"; git config user.email "actions@users.noreply.github.com"
          git add data/sites-raw ':!data/sites-raw/REQUEST.txt'
          git diff --cached --quiet || git commit -m "data: raw site extracts (sources=$SOURCES countries=$COUNTRIES) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Merge, de-duplicate, report, regenerate ledger (on top of the latest branch, so other sessions' edits are kept)
        run: node tools/build-sites.mjs
      - name: Commit generated files
        run: |
          git add data/sites.csv data/sites-report.json docs/fort-fidelity
          git diff --cached --quiet || git commit -m "data: site universe, ledger and plan numbers [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
