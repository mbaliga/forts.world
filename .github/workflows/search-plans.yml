name: search-plans
on:
  push:
    branches: [dev]
    paths: ['data/plans/SEARCH.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  search:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/search-plans.mjs
      - name: Commit search results (skip loop)
        run: |
          git config user.name "search-plans"; git config user.email "actions@users.noreply.github.com"
          git add data/plans/search
          (git diff --cached --quiet || git commit -m "data: Commons plan search results [skip ci]") && git pull --rebase origin "${GITHUB_REF_NAME}" && git push
