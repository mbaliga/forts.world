# CI smoke on every push to dev and every PR: the evidence gate over all traces, then a date-seeded sample of
# 20 auto-T1 scenes plus the hand-authored flagships. Budgets come from tools/trace/budget.mjs.
name: smoke-sample
on:
  push: {branches: [dev]}
  pull_request: {branches: [dev, main]}
jobs:
  smoke:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && pnpm i --frozen-lockfile
      - run: node tools/check_sources.mjs
      - run: node tools/smoke.mjs --t1 20
      - name: Flagships
        run: for id in murud-janjira kumbhalgarh; do node tools/smoke.mjs $id; done
