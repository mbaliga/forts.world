# Builds the public site and deploys it to Cloudflare Pages.
#   main -> production (forts.world once the custom domain is attached), dev -> a preview at dev.<project>.pages.dev.
# It does nothing until the repository has the secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID;
# the build still runs, so a broken site shows up here before it can ship.
# Site layout: /            the home page and time map (web/home) with its generated site data
#              /atlas/      the Forts of the World atlas (web/forts-of-the-world) with its generated data bundle
#              /ten-forts.html  the hand-built walkable reconstructions
#              /search/     the fort search page (web/fort-search)
# The full game (dist/index.html) is not deployed yet: one file is over the 25 MiB Pages limit because it bundles the
# 50 MB trace index. Split that index first (see README, "Before launch").
name: deploy-pages
on:
  push:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions: {contents: read, deployments: write}
concurrency:
  group: deploy-pages-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'forts-world' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: corepack enable && pnpm i --frozen-lockfile
      - name: Build the site data, the atlas bundle and the ten-forts page
        run: |
          node tools/world/build-home.mjs web/home/data
          NODE_OPTIONS=--max-old-space-size=6144 node tools/world/build-atlas.mjs web/forts-of-the-world
          node tools/world/build-reconstructions.mjs web/forts-of-the-world/ten-forts.html
      - name: Assemble the site
        run: |
          rm -rf _site && mkdir -p _site/search _site/atlas
          cp -r web/home/. _site/ && rm -f _site/README.md
          cp -r web/forts-of-the-world/. _site/atlas/ && rm -f _site/atlas/README.md
          mv _site/atlas/ten-forts.html _site/ten-forts.html
          cp -r web/fort-search/. _site/search/ && rm -f _site/search/README.md
          cp LICENSES.md NOTICE _site/
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          echo "files: $(find _site -type f | wc -l)  size: $(du -sh _site | cut -f1)"
          big=$(find _site -type f -size +25M); [ -z "$big" ] || { echo "over the 25 MiB Pages limit:"; echo "$big"; exit 1; }
          [ "$(find _site -type f | wc -l)" -le 20000 ] || { echo "more than 20,000 files (Pages free limit)"; exit 1; }
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; the site was built but not deployed."; exit 0
          fi
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy _site --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
