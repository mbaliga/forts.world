name: fetch-plans
on:
  push:
    branches: [dev]
    paths: ['data/plans/REQUEST.csv']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/fetch-plans.mjs
      - name: Commit plans (skip loop)
        run: |
          git config user.name "fetch-plans"; git config user.email "actions@users.noreply.github.com"
          git add data/plans ':!data/plans/REQUEST.csv'
          (git diff --cached --quiet || git commit -m "data: plans and photos from Wikimedia Commons [skip ci]") && git pull --rebase origin "${GITHUB_REF_NAME}" && git push
